name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate
        required: false
        type: string

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore RetryShield.slnx
      - run: dotnet build RetryShield.slnx --configuration Release --no-restore
      - name: Run unit tests
        run: dotnet test tests/RetryShield.Domain.Tests/RetryShield.Domain.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=unit.trx"
      - name: Run integration tests
        run: dotnet test tests/RetryShield.Integration.Tests/RetryShield.Integration.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=integration.trx"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dotnet-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - run: npm ci
        working-directory: web/admin
      - run: npm test
        working-directory: web/admin
      - run: npm run build
        working-directory: web/admin
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web/admin
      - run: npm run test:e2e
        working-directory: web/admin

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Enforce dependency direction
        shell: pwsh
        run: ./scripts/check-architecture.ps1

  compose-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password-not-for-production
      REDIS_PASSWORD: ci-redis-password-not-for-production
      RETRYSHIELD_ADMIN_API_KEY: ci-admin-key-not-for-production
      RETRYSHIELD_ENCRYPTION_KEY: bG9jYWwtZGV2ZWxvcG1lbnQta2V5LTMyLWJ5dGVzISE=
      GRAFANA_ADMIN_PASSWORD: ci-grafana-password-not-for-production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: docker compose -f deploy/compose.yml config --quiet
      - run: docker compose --env-file deploy/.env.example --profile demo -f deploy/compose.yml -f deploy/compose.release.yml config --quiet
      - run: UPSTREAM_BASE_URL=https://payments.example.test/ docker compose --env-file deploy/.env.example -f deploy/compose.yml -f deploy/compose.production.yml -f deploy/compose.release.yml config --quiet
      - name: Run full-stack idempotency smoke test
        run: bash ./scripts/smoke.sh
