name: Container release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag (for example v1.2.3)
        required: true

permissions: read-all

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be semantic version form vMAJOR.MINOR.PATCH[-PRERELEASE]" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  quality:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      POSTGRES_PASSWORD: release-postgres-password-not-for-production
      REDIS_PASSWORD: release-redis-password-not-for-production
      RETRYSHIELD_ADMIN_API_KEY: release-admin-key-not-for-production
      RETRYSHIELD_ENCRYPTION_KEY: bG9jYWwtZGV2ZWxvcG1lbnQta2V5LTMyLWJ5dGVzISE=
      GRAFANA_ADMIN_PASSWORD: release-grafana-password-not-for-production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.version }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore RetryShield.slnx
      - run: dotnet build RetryShield.slnx --configuration Release --no-restore
      - run: dotnet test RetryShield.slnx --configuration Release --no-build
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - run: npm ci
        working-directory: web/admin
      - run: npm test
        working-directory: web/admin
      - run: npm run build
        working-directory: web/admin
      - run: npx playwright install --with-deps chromium
        working-directory: web/admin
      - run: npm run test:e2e
        working-directory: web/admin
      - name: Enforce architecture boundaries
        shell: pwsh
        run: ./scripts/check-architecture.ps1
      - name: Prove one forward and one replay
        run: bash ./scripts/smoke.sh

  publish:
    needs: [validate, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gateway
            dockerfile: Dockerfile.gateway
            target: final
          - image: admin-api
            dockerfile: Dockerfile.admin-api
            target: final
          - image: admin-dashboard
            dockerfile: Dockerfile.admin-api
            target: dashboard
          - image: demo
            dockerfile: Dockerfile.demo
            target: final
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.version }}
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/retryshield-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate.outputs.version }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      - name: Record verifiable GitHub build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/${{ steps.owner.outputs.name }}/retryshield-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Scan the released image for high-severity vulnerabilities
        run: |
          docker run --rm \
            aquasec/trivy:0.66.0@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e \
            image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL \
            "ghcr.io/${{ steps.owner.outputs.name }}/retryshield-${{ matrix.image }}:${{ steps.meta.outputs.version }}"
