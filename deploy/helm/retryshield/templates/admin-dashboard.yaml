apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "retryshield.fullname" . }}-admin-dashboard
  labels:
    {{- include "retryshield.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-dashboard
spec:
  replicas: {{ .Values.adminDashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "retryshield.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: admin-dashboard
  template:
    metadata:
      labels:
        {{- include "retryshield.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: admin-dashboard
    spec:
      containers:
        - name: admin-dashboard
          image: "{{ .Values.adminDashboard.image.repository }}:{{ .Values.adminDashboard.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: {{ .Values.adminDashboard.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.adminDashboard.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.adminDashboard.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.adminDashboard.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.adminDashboard.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.adminDashboard.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.adminDashboard.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.adminDashboard.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.adminDashboard.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.adminDashboard.livenessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.adminDashboard.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "retryshield.fullname" . }}-admin-dashboard
  labels:
    {{- include "retryshield.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-dashboard
spec:
  type: {{ .Values.adminDashboard.service.type }}
  selector:
    {{- include "retryshield.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: admin-dashboard
  ports:
    - name: http
      port: {{ .Values.adminDashboard.service.port }}
      targetPort: http
